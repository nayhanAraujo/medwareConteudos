# Exemplo — NÃO ativar em produção até homologação completa.
# Anexar como template ou stage separado no pipeline principal.

steps:
  - task: UseDotNet@2
    inputs:
      packageType: sdk
      version: 10.x

  - task: NodeTool@0
    inputs:
      versionSpec: '22.23.3'

  # Agente Windows limpo, sem variáveis secretas; somente HEAD commitado.
  - task: PowerShell@2
    displayName: Pacote limpo IIS API e Nuxt SSR
    inputs:
      pwsh: true
      filePath: tools/production/Build-Package.ps1
      arguments: '-OutputDirectory "$(Build.ArtifactStagingDirectory)/mdw-$(Build.BuildId)"'
  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)/mdw-$(Build.BuildId)'
      artifact: mdw-producao-iis
  # Sem instalação ou execução remota. Seguir PRODUCAO_IIS.md na VM.
