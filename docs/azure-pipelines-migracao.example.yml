# Exemplo — NÃO ativar em produção até homologação completa.
# Anexar como template ou stage separado no pipeline principal.

steps:
  - task: UseDotNet@2
    inputs:
      packageType: sdk
      version: 10.x

  - script: |
      dotnet publish "$(Build.SourcesDirectory)/backend/MdwConteudos.Api/MdwConteudos.Api.csproj" -c Release -o "$(Build.ArtifactStagingDirectory)/api"
    displayName: Publish API .NET

  - task: NodeTool@0
    inputs:
      versionSpec: '22.x'

  - script: |
      cd "$(Build.SourcesDirectory)/frontend/nuxt-app"
      npm ci
      npm run build
    displayName: Build Nuxt

  # Deploy: copiar api/ e .output/ para servidor; configurar NSSM Kestrel + IIS para Nuxt
